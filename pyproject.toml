[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pipes"
version = "0.1.0"
description = "Pipes puzzle environment with algorithm benchmarking"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pygame>=2.1",
]

[project.optional-dependencies]
rl  = ["gymnasium>=0.29"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
pipes-play = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
