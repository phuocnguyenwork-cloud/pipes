[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pipes"
version = "0.2.0"
description = "Pipes puzzle environment with classic search algorithms and reasoning tracer"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pygame>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
pipes-play = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
